<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Writing Assistant — Settings</title>

    <!-- FontAwesome (CDN) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../src/styles/options.css">
</head>
<body>

    <div class="options-container">
        <h1>AI Writing Assistant — Settings</h1>

        <div class="field">
            <label for="endpoint">Vercel API endpoint</label>
            <input type="url" id="endpoint" placeholder="https://your-app.vercel.app/api/chat" />
            <p class="hint">URL of your deployed Vercel <code>/api/chat</code> function. The API key stays on Vercel as an environment variable — it is never stored in the extension.</p>
        </div>

        <div class="field">
            <label for="maxChars">Max input characters</label>
            <input type="number" id="maxChars" min="1" max="100000" placeholder="2000" />
            <p class="hint">Messages longer than this are blocked before sending.</p>
        </div>

        <div class="actions">
            <button id="saveBtn"><i class="fas fa-floppy-disk"></i> Save</button>
            <span id="status" class="status"></span>
        </div>
    </div>

    <script src="../src/scripts/options.js"></script>

</body>
</html>
