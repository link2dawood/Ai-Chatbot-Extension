<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Writing Assistant</title>

    <!-- FontAwesome (CDN) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../src/styles/popup.css">
</head>
<body>

    <div class="chat-container">
        <!-- Theme Toggle -->
        <button id="themeToggle" class="theme-btn"><i class="fas fa-moon"></i></button>

        <h2 class="chat-title">AI Writing Assistant</h2>

        <!-- Toolbar: conversation mode + history management -->
        <div class="toolbar">
            <select id="modeSelect" class="mode-select" title="Conversation mode">
                <option value="chat">💬 Chat</option>
                <option value="writing">✍️ Improve writing</option>
                <option value="grammar">✅ Fix grammar</option>
                <option value="summarize">📝 Summarize</option>
                <option value="explain">💡 Explain</option>
            </select>
            <div class="toolbar-actions">
                <button id="exportBtn" title="Export chat"><i class="fas fa-download"></i></button>
                <button id="clearBtn" title="Clear chat"><i class="fas fa-trash"></i></button>
            </div>
        </div>

        <!-- Chat Box -->
        <div id="chatBox" class="chat-box"></div>

        <!-- Input Section -->
        <div class="chat-input">
            <textarea id="inputText" placeholder="Type your text here..."></textarea>
            <button id="sendBtn"><i class="fas fa-paper-plane"></i></button>
            <button id="copyBtn"><i class="fas fa-copy"></i></button>
            <button id="injectBtn"><i class="fas fa-sign-in-alt"></i></button>
        </div>

        <!-- Character counter + token usage -->
        <div class="input-meta">
            <span id="charCounter" class="char-counter">0 / 2000</span>
            <span id="tokenCounter" class="token-counter" title="Approximate API tokens used this session">~0 tokens</span>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="../src/scripts/popup.js"></script>

</body>
</html>
